# Zariia — headers applied to EVERY response.
#
# 🔴 This file exists because of an nginx rule that fails silently:
#    add_header directives are inherited from the enclosing level ONLY IF the
#    current level declares no add_header of its own. Any location that sets
#    its own Cache-Control therefore DROPS every security header — including
#    the CSP — with no error and no warning. The headers stay in the config
#    and vanish from the response.
#
#    So: include this in the server block AND in every location that declares
#    any add_header. If you add a location with an add_header, include it there
#    too, and verify with `curl -sI`, not by reading the config.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
# 🔴 STRICTLY SAME-ORIGIN since 29 July 2026. There is no third-party origin here and
#    none should be added back. The previous policy allowed cdn.jsdelivr.net and three
#    huggingface hosts for the player's neural decoder, and it did not work: Hugging Face
#    serves model weights from us.aws.cdn.hf.co, which was not on the list. The fetch was
#    blocked, and because the player caught every post-decryption failure in one handler,
#    a keyholder with the CORRECT key was told the key was wrong. An allow-list of CDN
#    hostnames is a guess about somebody else's infrastructure, and it silently expires.
#    The player now uses codecs the browser already has. Nothing to fetch, nothing to allow.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
