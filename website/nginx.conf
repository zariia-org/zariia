server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    include /etc/nginx/conf.d/headers.conf;

    # ── .mjs MUST be served as JavaScript ───────────────────────────────────
    # The player is built from ES modules. If .mjs arrives as octet-stream the
    # browser refuses to execute it on strict MIME checking, and the player
    # fails with a module error that looks like a code bug and is not one.
    # nginx's bundled mime.types does not map .mjs in every version.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        include /etc/nginx/conf.d/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── caching ─────────────────────────────────────────────────────────────
    # Every block below re-includes headers.conf. See the note in that file:
    # declaring add_header here would otherwise silently drop the CSP.
    location ~* \.html$ {
        include /etc/nginx/conf.d/headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(?:woff2|svg|png|ico|webmanifest)$ {
        include /etc/nginx/conf.d/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(?:css|js)$ {
        include /etc/nginx/conf.d/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }
    # Ground photographs. Deliberately a WEEK, not the year-plus-immutable the marks
    # and fonts get above. Those filenames never change their contents; these are
    # editorial and will be replaced — by real session photography once there has been
    # a session. `immutable` on a name that gets new bytes means a returning visitor
    # sees the old picture for a year with no way to force a refresh.
    location ~* \.(?:jpg|jpeg|webp|avif)$ {
        include /etc/nginx/conf.d/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The demo record. A week, and the player fetches it with a ?v= so a replacement
    # is not shadowed by a cached copy — or, as happened on 29 July 2026, by a cached
    # 404 from the window when the file was staged in the tarball but absent from the
    # image. FLAC is already compressed; gzip would cost CPU for nothing.
    location ~* \.flac$ {
        include /etc/nginx/conf.d/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    # woff2 is already compressed; re-compressing wastes CPU for nothing.

    location / {
        try_files $uri $uri/ =404;
    }

    # Pretty URLs: /the-name serves the-name.html without a redirect.
    location ~ ^/([a-z0-9-]+)$ {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /health { access_log off; return 200 "ok\n"; }
}
